[project]
name = "microservices-notification"
version = "0.1.0"
description = "Микросервис notification"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ms-events",
    "aiokafka>=0.13.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi",
    "psycopg2>=2.9.11",
    "pydantic>=2.0",
    "pydantic-settings",
    "structlog>=25.5.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.14.9",
]
