[project]
name = "microservices-orders-history"
version = "0.1.0"
description = "Микросервис orders-history"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ms-events",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "asyncpg",
    "alembic",
    "pydantic>=2.0",
    "pydantic-settings",
    "structlog",
    "psycopg2>=2.9.11",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "greenlet>=3.3.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.14.9",
]
