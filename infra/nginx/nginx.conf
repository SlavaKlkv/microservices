worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Логи
  access_log  /var/log/nginx/access.log;
  error_log   /var/log/nginx/error.log warn;

  sendfile        on;
  keepalive_timeout  65;

  upstream auth_service {
    server auth-service:8000;
  }

  upstream orders_service {
    server orders-service:8000;
  }

  upstream history_service {
    server orders-history-service:8000;
  }


  server {
    listen 80;
    server_name _;

    location = /health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # Временный endpoint метрик для проверки инфраструктуры
    # Будет заменён на nginx-prometheus-exporter позже
    location = /metrics {
      return 200 'nginx_metrics_placeholder';
      add_header Content-Type text/plain;
    }

    # ----------------------
    # Маршрутизация API (микросервисы)
    # ----------------------

    location /auth/ {
      proxy_pass http://auth_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;
    }

    location /orders/ {
      proxy_pass http://orders_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;
    }

    location /history/ {
      proxy_pass http://history_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;
    }
