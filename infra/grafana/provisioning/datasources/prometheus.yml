# Манифест источника данных Grafana.
# Раньше здесь по ошибке лежал scrape-конфиг Prometheus: Grafana такой
# файл не понимает, провижининг молча не срабатывал, и datasource
# приходилось заводить руками через UI.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Совпадает с scrape_interval в infra/prometheus/prometheus.yml:
      # иначе графики «рвутся» на пустых интервалах.
      timeInterval: 15s
