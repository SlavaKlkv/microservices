global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ----------------------
  # Prometheus self
  # ----------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # ----------------------
  - job_name: "nginx"
    metrics_path: /metrics
    static_configs:
      - targets: ["nginx:80"]

  # ----------------------
  - job_name: "auth-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8000"]

  - job_name: "orders-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["orders-service:8000"]

  - job_name: "orders-history-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["orders-history-service:8000"]

  # ----------------------
  # Kafka (JMX / exporter будет добавлен позже)
  # ----------------------
  # - job_name: "kafka"
  #   static_configs:
  #     - targets: ["kafka:9092"]
