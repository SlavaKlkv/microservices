name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Новый пуш в ту же ветку отменяет предыдущий прогон: гонять полный
# пайплайн на устаревшем коммите незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Линтеры и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Установка зависимостей
        run: uv sync --all-packages

      - name: ruff check
        run: uv run ruff check tests services packages

      - name: ruff format
        run: uv run ruff format --check tests services packages

      - name: mypy
        run: uv run mypy packages services tests

  test:
    name: Тесты и миграции
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Без healthcheck шаг с тестами стартует раньше, чем база
        # успевает принять первое соединение.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Установка зависимостей
        run: uv sync --all-packages

      # Интеграционные тесты сами накатывают миграции всех трёх сервисов,
      # прогоняют alembic check и downgrade base с повторным upgrade.
      - name: pytest (unit + integration)
        env:
          TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest tests -v

  build:
    name: Сборка образов
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, orders, orders_history, notification]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Сборка ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          # Контекст — корень репозитория: иначе общий пакет ms-events
          # не попадёт в образ.
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: microservices-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  e2e:
    name: Сага через настоящую Kafka
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Установка зависимостей
        run: uv sync --all-packages

      # Реальных секретов в compose нет: примеры содержат плейсхолдеры,
      # их достаточно для локального стека.
      - name: Подготовка окружения
        run: |
          cp .env.example .env
          for s in auth orders orders_history notification; do
            cp "services/$s/.env.docker.example" "services/$s/.env.docker"
          done

      # --wait перечисляет только долгоживущие сервисы: job'ы миграций и
      # kafka-init штатно завершаются с кодом 0, и ждать от них
      # «здоровья» нечего. Зависимости всё равно поднимутся первыми.
      - name: Поднять стек
        run: |
          docker compose up -d --build --wait \
            auth-service orders-service orders-history-service \
            notification-service \
            orders-outbox-worker notification-outbox-worker \
            orders-consumer orders-history-consumer \
            notification-consumer \
            nginx

      - name: pytest -m e2e
        env:
          E2E_BASE_URL: http://localhost
        run: uv run pytest tests/e2e -v

      # Логи нужны именно при падении: по ним видно, на каком шаге саги
      # событие застряло.
      - name: Логи стека при падении
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Погасить стек
        if: always()
        run: docker compose down -v
