name: ${PROJECT_NAME}

networks:
  microservices_net:
    driver: bridge

volumes:
  pg_auth_data:
  pg_orders_data:
  pg_history_data:
  pg_notification_data:
  grafana_data:

# ----------------------
# Общие фрагменты
# ----------------------

# Проверка готовности HTTP-сервиса. curl в образах нет, зато есть python.
x-http-healthcheck: &http-healthcheck
  test:
    - CMD-SHELL
    - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready').read()"
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

# Одноразовые job'ы (миграции, создание топиков) не перезапускаем.
x-oneshot: &oneshot
  restart: "no"
  networks:
    - microservices_net

# Фоновые процессы: воркеры и консьюмеры. Порт не слушают, поэтому
# healthcheck'а у них нет; SIGTERM они обрабатывают сами, отсюда
# увеличенный stop_grace_period — дать докоммитить офсеты и батч.
x-background: &background
  restart: unless-stopped
  stop_grace_period: 30s
  networks:
    - microservices_net

x-auth-image: &auth-image
  build:
    context: .
    dockerfile: services/auth/Dockerfile
  env_file:
    - ./services/auth/.env.docker

x-orders-image: &orders-image
  build:
    context: .
    dockerfile: services/orders/Dockerfile
  env_file:
    - ./services/orders/.env.docker

x-history-image: &history-image
  build:
    context: .
    dockerfile: services/orders_history/Dockerfile
  env_file:
    - ./services/orders_history/.env.docker

x-notification-image: &notification-image
  build:
    context: .
    dockerfile: services/notification/Dockerfile
  env_file:
    - ./services/notification/.env.docker

services:
  # ----------------------
  # Базы данных (одна БД на сервис)
  # ----------------------
  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    networks:
      - microservices_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-orders:
    image: postgres:16-alpine
    container_name: postgres-orders
    environment:
      POSTGRES_DB: ${ORDERS_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${ORDERS_DB_PORT}:5432"
    volumes:
      - pg_orders_data:/var/lib/postgresql/data
    networks:
      - microservices_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${ORDERS_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-history:
    image: postgres:16-alpine
    container_name: postgres-history
    environment:
      POSTGRES_DB: ${HISTORY_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${HISTORY_DB_PORT}:5432"
    volumes:
      - pg_history_data:/var/lib/postgresql/data
    networks:
      - microservices_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${HISTORY_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-notifications:
    image: postgres:16-alpine
    container_name: postgres-notifications
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${NOTIFICATION_DB_PORT}:5432"
    volumes:
      - pg_notification_data:/var/lib/postgresql/data
    networks:
      - microservices_net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${NOTIFICATION_DB_NAME}
      interval: 5s
      timeout: 3s
      retries: 20

  # ----------------------
  # Инфраструктура
  # ----------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - microservices_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: kafka
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}

      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      ALLOW_PLAINTEXT_LISTENER: "yes"
      # Топики заводит kafka-init с нужным числом партиций. С автосозданием
      # первый подписавшийся консьюмер получил бы топик на одну партицию.
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    networks:
      - microservices_net
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Явно заводит топики саги и парные DLQ. Ключ партиционирования —
  # order_id, поэтому партиций может быть больше одной: порядок событий
  # внутри заказа всё равно сохраняется. DLQ хватает одной партиции.
  kafka-init:
    <<: *oneshot
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -e
        for topic in orders.events.v1 notifications.events.v1; do
          kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} \
            --create --if-not-exists --topic "$$topic" \
            --partitions ${KAFKA_TOPIC_PARTITIONS} \
            --replication-factor ${KAFKA_TOPIC_REPLICATION_FACTOR}
          kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} \
            --create --if-not-exists --topic "$$topic.dlq" \
            --partitions 1 \
            --replication-factor ${KAFKA_TOPIC_REPLICATION_FACTOR}
        done
        kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --list

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    ports:
      - "8080:8080"
    networks:
      - microservices_net

  # Локальная «почта»: письма сервиса уведомлений видны в веб-интерфейсе,
  # настоящий SMTP для проверки саги не нужен.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "${MAILHOG_HTTP_PORT}:8025"
    networks:
      - microservices_net

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "${NGINX_HTTP_PORT}:80"
    networks:
      - microservices_net
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # ----------------------
  # Метрики и мониторинг
  # ----------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - microservices_net
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - microservices_net
    volumes:
      - grafana_data:/var/lib/grafana

  # ----------------------
  # Миграции: отдельные one-shot job'ы.
  # Раньше alembic upgrade head висел в command самого API-сервиса —
  # при нескольких процессах на одну БД это гонка за таблицу alembic_version.
  # ----------------------
  auth-migrate:
    <<: [*auth-image, *oneshot]
    container_name: auth-migrate
    depends_on:
      postgres-auth:
        condition: service_healthy
    command: ["uv", "run", "alembic", "-c", "auth/alembic.ini", "upgrade", "head"]

  orders-migrate:
    <<: [*orders-image, *oneshot]
    container_name: orders-migrate
    depends_on:
      postgres-orders:
        condition: service_healthy
    command: ["uv", "run", "alembic", "-c", "orders/alembic.ini", "upgrade", "head"]

  orders-history-migrate:
    <<: [*history-image, *oneshot]
    container_name: orders-history-migrate
    depends_on:
      postgres-history:
        condition: service_healthy
    command: ["uv", "run", "alembic", "-c", "orders_history/alembic.ini", "upgrade", "head"]

  notification-migrate:
    <<: [*notification-image, *oneshot]
    container_name: notification-migrate
    depends_on:
      postgres-notifications:
        condition: service_healthy
    command: ["uv", "run", "alembic", "-c", "notification/alembic.ini", "upgrade", "head"]

  # ----------------------
  # HTTP API
  # ----------------------
  auth-service:
    <<: *auth-image
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    ports:
      - "${AUTH_SERVICE_PORT}:8000"
    command: ["uv", "run", "uvicorn", "auth.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck: *http-healthcheck
    networks:
      - microservices_net

  orders-service:
    <<: *orders-image
    container_name: orders-service
    restart: unless-stopped
    depends_on:
      orders-migrate:
        condition: service_completed_successfully
    ports:
      - "${ORDERS_SERVICE_PORT}:8000"
    command: ["uv", "run", "uvicorn", "orders.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck: *http-healthcheck
    networks:
      - microservices_net

  orders-history-service:
    <<: *history-image
    container_name: orders-history-service
    restart: unless-stopped
    depends_on:
      orders-history-migrate:
        condition: service_completed_successfully
    ports:
      - "${HISTORY_SERVICE_PORT}:8000"
    command: ["uv", "run", "uvicorn", "orders_history.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck: *http-healthcheck
    networks:
      - microservices_net

  notification-service:
    <<: *notification-image
    container_name: notification-service
    restart: unless-stopped
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:8000"
    command: ["uv", "run", "uvicorn", "notification.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck: *http-healthcheck
    networks:
      - microservices_net

  # ----------------------
  # Outbox-воркеры: публикуют накопленные события в Kafka.
  # ----------------------
  orders-outbox-worker:
    <<: [*orders-image, *background]
    container_name: orders-outbox-worker
    depends_on:
      orders-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    command: ["uv", "run", "python", "-m", "orders.outbox_worker"]

  notification-outbox-worker:
    <<: [*notification-image, *background]
    container_name: notification-outbox-worker
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    command: ["uv", "run", "python", "-m", "notification.outbox_worker"]

  # ----------------------
  # Консьюмеры саги. Redis — быстрый путь идемпотентности, поэтому
  # ждём и его: без Redis консьюмер работает, но в деградации.
  # ----------------------
  orders-consumer:
    <<: [*orders-image, *background]
    container_name: orders-consumer
    depends_on:
      orders-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uv", "run", "python", "-m", "orders.consumer"]

  orders-history-consumer:
    <<: [*history-image, *background]
    container_name: orders-history-consumer
    depends_on:
      orders-history-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uv", "run", "python", "-m", "orders_history.consumer"]

  notification-consumer:
    <<: [*notification-image, *background]
    container_name: notification-consumer
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uv", "run", "python", "-m", "notification.consumer"]
