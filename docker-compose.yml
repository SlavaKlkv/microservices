name: ${PROJECT_NAME}

networks:
  microservices_net:
    driver: bridge

volumes:
  pg_auth_data:
  pg_orders_data:
  pg_history_data:
  grafana_data:

services:
  # ----------------------
  # Базы данных (одна БД на сервис)
  # ----------------------
  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    networks:
      - microservices_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-orders:
    image: postgres:16-alpine
    container_name: postgres-orders
    environment:
      POSTGRES_DB: ${ORDERS_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${ORDERS_DB_PORT}:5432"
    volumes:
      - pg_orders_data:/var/lib/postgresql/data
    networks:
      - microservices_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${ORDERS_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-history:
    image: postgres:16-alpine
    container_name: postgres-history
    environment:
      POSTGRES_DB: ${HISTORY_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${HISTORY_DB_PORT}:5432"
    volumes:
      - pg_history_data:/var/lib/postgresql/data
    networks:
      - microservices_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${HISTORY_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: kafka
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}

      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    networks:
      - microservices_net
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    ports:
      - "8080:8080"
    networks:
      - microservices_net

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "${NGINX_HTTP_PORT}:80"
    networks:
      - microservices_net
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # ----------------------
  # Метрики и мониторинг
  # ----------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - microservices_net
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - microservices_net
    volumes:
      - grafana_data:/var/lib/grafana

  auth-service:
    build: ./services/auth
    container_name: auth-service
    env_file:
      - ./services/auth/.env.docker
    depends_on:
      postgres-auth:
        condition: service_healthy
    ports:
      - "${AUTH_SERVICE_PORT}:8000"
    command: >
      sh -c "
      uv run alembic -c auth/alembic.ini upgrade head &&
      uv run uvicorn auth.main:app --host 0.0.0.0 --port 8000
      "
    networks:
      - microservices_net

  orders-service:
     build: ./services/orders
     container_name: orders-service
     env_file:
       - ./services/orders/.env.docker
     depends_on:
       postgres-orders:
         condition: service_healthy
       kafka:
         condition: service_healthy
     ports:
       - "${ORDERS_SERVICE_PORT}:8000"
     command: >
       sh -c "
       uv run alembic -c orders/alembic.ini upgrade head &&
       uv run uvicorn orders.main:app --host 0.0.0.0 --port 8000
       "
     networks:
       - microservices_net

  orders-history-service:
     build: ./services/orders_history
     container_name: orders-history-service
     env_file:
       - ./services/orders_history/.env.docker
     depends_on:
       postgres-history:
         condition: service_healthy
       kafka:
         condition: service_healthy
     ports:
       - "${HISTORY_SERVICE_PORT}:8000"
     command: >
       sh -c "
       uv run alembic -c orders_history/alembic.ini upgrade head &&
       uv run uvicorn orders_history.main:app --host 0.0.0.0 --port 8000
       "
     networks:
       - microservices_net