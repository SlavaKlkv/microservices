[project]
name = "microservices"
version = "0.1.0"
description = "Микросервисы заказов: сага-хореография на Kafka"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
ms-events = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "ruff>=0.14.9",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "testcontainers[postgres]>=4.9.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
# Почти все тесты саги асинхронные: ручной маркер на каждом только шумит.
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["services", "packages/events/src"]
markers = [
    "integration: нужен живой PostgreSQL (или docker для testcontainers)",
    "e2e: нужен поднятый docker compose со всей сагой",
    "service(name): к какой базе сервиса подключается интеграционный тест",
]

[tool.ruff]
line-length = 79
extend-exclude = ["*/alembic/versions/*"]

[tool.ruff.lint]
# Явный набор: стабилен между версиями ruff.
select = ["E4", "E7", "E9", "E501", "F", "I"]

# Пакеты сервисов лежат в services/<name>, а импортируются по короткому
# имени. Без явного списка ruff относит их к сторонним по-разному в разных
# версиях, и порядок импортов «плывёт» между машинами и CI.
[tool.ruff.lint.isort]
known-first-party = [
    "ms_events",
    "auth",
    "orders",
    "orders_history",
    "notification",
    "tests",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
# Каталоги alembic содержат одноимённые модули env.py в каждом сервисе,
# для mypy это конфликт имён; сами миграции типизировать смысла нет.
exclude = ["/alembic/"]

[[tool.mypy.overrides]]
module = "ms_events.*"
strict = true

# mypy 2.x включает strict по умолчанию. Для сервисов держим мягкий режим:
# они писались без полной аннотации, ужесточаем постепенно.
# Тесты — не продакшен-код: полная аннотация фикстур и фейков только
# мешала бы читать сами проверки.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
disallow_subclassing_any = false
warn_return_any = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["auth.*", "orders.*", "orders_history.*", "notification.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_subclassing_any = false
warn_return_any = false
warn_unused_ignores = false
